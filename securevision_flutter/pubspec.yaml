name: securevision_flutter
description: SecureVision Flutter UI with embedded Python CV backend.
version: 0.1.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  camera: ^0.10.5+9
  web_socket_channel: ^2.4.5
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.5.0
  window_manager: ^0.3.8
  tray_manager: ^0.2.3

  # Material icons are bundled with Flutter.
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bundle Python backend and models for mobile
  assets:
    # Python backend modules
    - ../cam_vision/
    - ../cam_vision/config.py
    - ../cam_vision/face/
    - ../cam_vision/plates/
    - ../cam_vision/pipeline/
    - ../cam_vision/io/
    - ../cam_vision/ui/
    - ../cam_vision/flutter_bridge/

    # YOLO model weights
    - ../weights/yolov8n_plate.pt

    # Initial data directories (create empty if needed)
    - ../data/.gitkeep
