[tool.poetry]
name = "cam-vision"
version = "0.1.0"
description = "Lean live CV: trusted faces + license plates (no training), modular and self-hosted."
authors = ["michaelflppv <mikhail.filippov@students.uni-mannheim.de>"]
readme = "README.md"

[tool.poetry.scripts]
securevision-capture = "cam_vision.cli.run_capture:main"
securevision-face-enroll = "cam_vision.face.enroll:main"
securevision-face-demo = "cam_vision.cli.run_face:main"
securevision-preview = "cam_vision.cli.run_preview:main"
securevision-plates = "cam_vision.cli.run_plates:main"
securevision-api = "cam_vision.cli.run_api:main"
securevision-qt = "cam_vision.cli.run_qt_ui:main"
securevision-onvif-discover = "cam_vision.cli.onvif_discover:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Keep runtime deps minimal in PR1. (Pipelines/UI/ALPR will be added in later PRs.)
pydantic = "^2.8.2"
pydantic-settings = "^2.11.0"

# PR3: Video capture dependencies
opencv-python = "^4.8.0"
numpy = "^1.24.0"

# PR4: Face recognition dependencies
insightface = "^0.7.3"
onnxruntime = "^1.16.0"
scikit-learn = "^1.3.0"
Pillow = "^10.0.0"

# PR5: License plate recognition dependencies
ultralytics = "^8.0.0"
pytesseract = "^0.3.10"

# PR6: Event storage and API dependencies
fastapi = "^0.115.0"
sqlmodel = "^0.0.22"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
websockets = "^13.0"
python-multipart = "^0.0.9"

# PR8: Qt UI dependencies
PySide6 = "^6.6.0"
qasync = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"
pre-commit = "^4.0.1"
pytest-mock = "^3.12.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
