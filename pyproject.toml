[tool.poetry]
name = "cam-vision"
version = "0.1.0"
description = "Lean live CV: trusted faces + license plates (no training), modular and self-hosted."
readme = "README.md"

[tool.poetry.scripts]
securevision-capture = "cam_vision.cli.run_capture:main"
securevision-face-enroll = "cam_vision.face.enroll:main"
securevision-face-demo = "cam_vision.cli.run_face:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Keep runtime deps minimal in PR1. (Pipelines/UI/ALPR will be added in later PRs.)
pydantic = "^2.8.2"
pydantic-settings = "^2.11.0"

# PR3: Video capture dependencies
opencv-python = "^4.8.0"
numpy = "^1.24.0"

# PR4: Face recognition dependencies
insightface = "^0.7.3"
onnxruntime = "^1.16.0"
scikit-learn = "^1.3.0"
Pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"
pre-commit = "^4.0.1"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
